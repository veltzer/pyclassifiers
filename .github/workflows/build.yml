name: build
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        # Primary key is unique per run so every successful run saves a fresh
        # cache. restore-keys lets the run start from the most recent cache
        # matching the prefix. Without this (static key), actions/cache never
        # re-saves once the first cache exists.
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install rsconstruct
      # Pinned deliberately: the templates in tera.templates/ use rsconstruct
      # features (e.g. toml_get) that only exist from this version on. Tracking
      # the floating "latest" release means a push can race ahead of the release
      # that implements what its templates call, which is exactly how this build
      # broke before. Bump this when a template starts needing a newer feature.
      run: |
        gh release download "$RSCONSTRUCT_VERSION" --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
      env:
        GH_TOKEN: ${{ github.token }}
        RSCONSTRUCT_VERSION: v0.9.54
    - name: install
      run: |
        rsconstruct tools install-deps
        rsconstruct tools install
    - name: build
      run: rsconstruct build
    - name: status
      run: rsconstruct status
